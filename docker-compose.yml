services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policy_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-policy_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policy_assistant_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_assistant -d policy_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: policy_assistant
      RABBITMQ_DEFAULT_PASS: policy_assistant_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/team-policy-realm.json:/opt/keycloak/data/import/team-policy-realm.json:ro

volumes:
  postgres-data:
  rabbitmq-data:
