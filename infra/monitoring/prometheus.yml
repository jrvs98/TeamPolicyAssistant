global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # The API and worker metrics endpoints are enabled as the app instrumentation is added.
  # Example:
  # - job_name: "team-policy-api"
  #   static_configs:
  #     - targets: ["api:8000"]
  #   metrics_path: /metrics
